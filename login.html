<div class="container">
  <div class="form-box">
    <h1 data-translate="login">Login</h1>

<script>
const API_BASE = 'https://itlearn.pythonanywhere.com';

function redirectToBanScreen(payload) {
  const reason = encodeURIComponent((payload && payload.ban_reason) || 'Account suspended for severe rule violations.');
  const appeal = encodeURIComponent((payload && payload.ban_appeal_url) || 'https://discord.gg/rKgF9s32EV');
  window.location.href = '/banned.html?reason=' + reason + '&appeal=' + appeal;
}

function updateInputPlaceholders(lang) {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  if (emailInput) emailInput.placeholder = translations[lang]['enterEmail'] || 'Enter your email';
  if (passwordInput) passwordInput.placeholder = translations[lang]['enterPassword'] || 'Enter your password';
}

function updatePasswordToggleLabels(lang) {
  const btn = document.querySelector('.password-toggle');
  if (!btn) return;
  const show = (translations[lang] && translations[lang]['showPassword']) ? translations[lang]['showPassword'] : 'Show password';
  const hide = (translations[lang] && translations[lang]['hidePassword']) ? translations[lang]['hidePassword'] : 'Hide password';
  btn.dataset.showLabel = show;
  btn.dataset.hideLabel = hide;
  const isPressed = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-label', isPressed ? hide : show);
  btn.setAttribute('title', isPressed ? hide : show);
}

function initPasswordToggle() {
  const pw = document.getElementById('password');
  const btn = document.querySelector('.password-toggle');
  if (!pw || !btn) return;
  if (window.feather) feather.replace();
  btn.addEventListener('click', () => {
    const showing = pw.type === 'text';
    pw.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-pressed', showing ? 'false' : 'true');
    const label = showing ? (btn.dataset.showLabel || 'Show password') : (btn.dataset.hideLabel || 'Hide password');
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
    btn.innerHTML = showing ? '<i data-feather="eye"></i>' : '<i data-feather="eye-off"></i>';
    if (window.feather) feather.replace();
    pw.focus();
  });
}

async function syncWithBackend(clerk) {
  const token = await clerk.session.getToken();
  const resp = await fetch(API_BASE + '/api/auth/sync', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ token }),
  });
  const data = await resp.json();
  if (!resp.ok) throw data;
  return data;
}

document.addEventListener('DOMContentLoaded', async () => {
  document.body.setAttribute('data-page', 'login');
  const storedLang = localStorage.getItem('language') || 'en';
  updatePageLanguage(storedLang);
  if (window.feather) feather.replace();
  updateInputPlaceholders(storedLang);
  initPasswordToggle();
  updatePasswordToggleLabels(storedLang);

  const clerk = window.Clerk;
  await clerk.load();

  if (clerk.session) {
    try {
      const syncData = await syncWithBackend(clerk);
      if (syncData.banned) { redirectToBanScreen(syncData); return; }
      window.location.href = '/learn/index.html';
    } catch (e) {}
    return;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const submitBtn = document.querySelector('#login-form .btn');
    if (submitBtn) submitBtn.disabled = true;

    try {
      const signInAttempt = await clerk.client.signIn.create({ identifier: email, password });

      if (signInAttempt.status === 'complete') {
        await clerk.setActive({ session: signInAttempt.createdSessionId });
        const syncData = await syncWithBackend(clerk);

        if (syncData.banned) { redirectToBanScreen(syncData); return; }

        if (localStorage.getItem('staff_login')) {
          localStorage.removeItem('staff_login');
          if (syncData.is_bio_admin) { window.location.href = '/admin-panel.html'; return; }
        }

        window.location.href = '/learn/index.html';
      } else {
        await showAlert('Login requires additional verification (status: ' + signInAttempt.status + ').', { title: 'Login' });
      }
    } catch (err) {
      const msg = err?.errors?.[0]?.longMessage || err?.error || 'Login failed. Check your credentials.';
      if (err?.banned) { redirectToBanScreen(err); return; }
      await showAlert('Login failed: ' + msg, { title: 'Login failed' });
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  });

  function initOAuthButton(provider, buttonId, clerkStrategy) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    const labelEl = btn.querySelector('.oauth-label');
    const baseLabel = labelEl ? labelEl.textContent : btn.textContent;
    const connecting = btn.dataset.connecting || ('Connecting to ' + provider + '...');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      if (labelEl) labelEl.textContent = connecting;
      else btn.textContent = connecting;

      if (provider === 'Discord') {
        const joinCheckbox = document.getElementById('join-discord-server');
        localStorage.setItem('discord_join_server', joinCheckbox?.checked ? 'true' : 'false');
      }

      try {
        await clerk.client.signIn.authenticateWithRedirect({
          strategy: clerkStrategy,
          redirectUrl: window.location.origin + '/sso-callback.html',
          redirectUrlComplete: window.location.origin + '/learn/index.html',
        });
      } catch (err) {
        const msg = err?.errors?.[0]?.longMessage || ('Could not start ' + provider + ' sign-in.');
        await showAlert(msg, { title: 'Sign-in error' });
        btn.disabled = false;
        if (labelEl) labelEl.textContent = baseLabel;
        else btn.textContent = baseLabel;
      }
    });
  }

  initOAuthButton('Google', 'google-login', 'oauth_google');
  initOAuthButton('GitHub', 'github-login', 'oauth_github');
  initOAuthButton('Discord', 'discord-login', 'oauth_discord');
});

const _origUpdatePageLanguage = window.updatePageLanguage;
window.updatePageLanguage = function(lang) {
  _origUpdatePageLanguage(lang);
  updateInputPlaceholders(lang);
  updatePasswordToggleLabels(lang);
};
</script>

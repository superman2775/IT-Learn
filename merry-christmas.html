<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Dancing Santa</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="merry-christmas.css">
</head>
<body>

  <h1>Merry Christmas!</h1>
  <p>Thanks for using IT Learn this year! We wish you a fun and inspiring 2026!</p>

  <div class="stage">
    <div class="santa-wrapper" id="santaWrapper">
      <div class="santa" id="santa">
        <div class="santa-head">
          <div class="hat"></div>
          <div class="beard"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nose"></div>
        </div>

        <div class="santa-body">
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="belt">
            <div class="buckle"></div>
          </div>
          <div class="buttons">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="legs">
          <div class="leg left">
            <div class="boot"></div>
          </div>
          <div class="leg right">
            <div class="boot"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

    <div id="cursor"></div>

  <script>
    const santa = document.getElementById('santa');
    const santaWrapper = document.getElementById('santaWrapper');

    // Start automatic dancing immediately when page loads
    function startEndlessDance() {
      santaWrapper.classList.add('active');
      santaWrapper.style.opacity = '1';
      santa.classList.add('dancing');
    }

    // Start dancing automatically on page load
    window.addEventListener('load', startEndlessDance);
  </script>
  <script>
    const cursor = document.getElementById('cursor');
    const trails = [];
    let mouseX = 0, mouseY = 0;
    let lastSantaTime = 0;
    
    // Update main cursor
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
      
      // Spawn Santa every 100ms max
      const now = Date.now();
      if (now - lastSantaTime > 100 && santas.length < 10) {
        createSanta(mouseX, mouseY);
        lastSantaTime = now;
      }
      
      // Update existing santas
      santas.forEach((trail, i) => {
        trail.life -= 0.025;
        trail.element.style.opacity = trail.life;
        if (trail.life <= 0) {
          trail.element.remove();
          santas.splice(i, 1);
        }
      });
    });
    
    function createSanta(x, y) {
      const santa = document.createElement('div');
      santa.className = 'santa';
      santa.innerHTML = '🎅';
      santa.style.left = x + 'px';
      santa.style.top = y + 'px';
      document.body.appendChild(santa);
      
      santas.push({
        element: trail,
        life: 1.0,
        targetX: x,
        targetY: y
      });
      
      // Activate immediately
      setTimeout(() => santa.classList.add('active'), 10);
    }
  </script>
  <!-- Snow Effect -->
  <script src="https://cdn.jsdelivr.net/gh/helpercode0/jsdeploy@main/snoweffect-react/1/1.2/js/script.js"></script>

</body>
</html>

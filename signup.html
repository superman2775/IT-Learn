<div class="container">
  <div class="form-box">
    <h1 data-translate="signup">Sign Up</h1>

    <form id="signup-form">
      <div class="input-group">
        <label for="email" data-translate="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" data-translate="enterEmail" required />
      </div>
      <div class="input-group password">
        <label for="password" data-translate="password">Password</label>
        <div class="input-row">
          <input type="password" id="password" placeholder="Create a password" data-translate="createPassword" required />
          <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password" title="Show password">
            <i data-feather="eye">👁️</i>
          </button>
        </div>
      </div>
      <div class="input-group password">
        <label for="confirm-password" data-translate="confirmPassword">Confirm Password</label>
        <div class="input-row">
          <input type="password" id="confirm-password" placeholder="Re-enter your password" data-translate="reenterPassword" required />
          <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password" title="Show password">
            <i data-feather="eye">👁️</i>
          </button>
        </div>
      </div>
      <div class="input-group" style="margin-top:.5rem;">
        <label style="display:flex;gap:.5rem;align-items:center;cursor:pointer;">
          <input type="checkbox" id="accept-terms" style="width:16px;height:16px;" />
          <span data-translate="iAgree">I agree to the</span>
          <a href="/terms/index.html" target="_blank" rel="noopener noreferrer" data-translate="signupTerms">Terms and Conditions</a>
        </label>
      </div>
      <button type="submit" class="btn" data-translate="createAccount">Create account</button>
    </form>

    <div id="verify-step">
      <p class="verify-hint">We sent a 6-digit code to <strong id="verify-email-display"></strong>. Enter it below to confirm your account.</p>
      <form id="verify-form">
        <div class="input-group">
          <label for="verify-code">Verification code</label>
          <input type="text" id="verify-code" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required />
        </div>
        <button type="submit" class="btn">Verify &amp; continue</button>
      </form>
      <button id="resend-btn" type="button">Resend code</button>
    </div>

    <div class="or-divider"><span data-translate="or">OR</span></div>

    <div class="oauth-grid">
      <button type="button" class="btn-oauth btn-google google" id="google-login" data-connecting="Connecting to Google...">
        <img src="https://files.itlearn.be/images/branding/icons/Google.png" alt="Google Logo" />
        <span class="oauth-label" data-translate="continueGoogle">Continue with Google</span>
      </button>
      <button type="button" class="btn-oauth btn-github github" id="github-login" data-connecting="Connecting to GitHub...">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Github_logo_svg.svg" alt="GitHub Logo" />
        <span class="oauth-label" data-translate="continueGitHub">Continue with GitHub</span>
      </button>
      <button type="button" class="btn-oauth btn-discord discord" id="discord-login" data-connecting="Connecting to Discord...">
        <img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/66e3d7f4ef6498ac018f2c55_Symbol.svg" alt="Discord Logo" />
        <span class="oauth-label" data-translate="continueDiscord">Continue with Discord</span>
      </button>
    </div>

    <div class="discord-join-option">
      <label>
        <input type="checkbox" id="join-discord-server" checked />
        <span data-translate="joinDiscordServer">Join our official Discord server</span>
      </label>
    </div>

    <p class="redirect-text">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</div>

<script>
const CLERK_PUBLISHABLE_KEY = 'pk_live_KEY_HERE';
const API_BASE = 'https://itlearn.pythonanywhere.com';

function updateInputPlaceholders(lang) {
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirm-password');
  if (emailInput) emailInput.placeholder = translations[lang]['enterEmail'] || 'Enter your email';
  if (passwordInput) passwordInput.placeholder = translations[lang]['createPassword'] || 'Create a password';
  if (confirmPasswordInput) confirmPasswordInput.placeholder = translations[lang]['reenterPassword'] || 'Re-enter your password';
}

function updatePasswordToggleLabels(lang) {
  document.querySelectorAll('.password-toggle').forEach(btn => {
    const show = (translations[lang] && translations[lang]['showPassword']) ? translations[lang]['showPassword'] : 'Show password';
    const hide = (translations[lang] && translations[lang]['hidePassword']) ? translations[lang]['hidePassword'] : 'Hide password';
    btn.dataset.showLabel = show;
    btn.dataset.hideLabel = hide;
    const isPressed = btn.getAttribute('aria-pressed') === 'true';
    btn.setAttribute('aria-label', isPressed ? hide : show);
    btn.setAttribute('title', isPressed ? hide : show);
  });
}

function initPasswordToggle() {
  document.querySelectorAll('.password-toggle').forEach(btn => {
    const row = btn.closest('.input-row');
    const input = row ? row.querySelector('input') : null;
    if (!input) return;
    if (window.feather) feather.replace();
    btn.addEventListener('click', () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-pressed', showing ? 'false' : 'true');
      const label = showing ? (btn.dataset.showLabel || 'Show password') : (btn.dataset.hideLabel || 'Hide password');
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
      btn.innerHTML = showing ? '<i data-feather="eye"></i>' : '<i data-feather="eye-off"></i>';
      if (window.feather) feather.replace();
      input.focus();
    });
  });
}

function showVerifyStep(email) {
  document.getElementById('signup-form').classList.add('hidden');
  document.getElementById('verify-step').classList.add('visible');
  document.getElementById('verify-email-display').textContent = email;
  document.getElementById('verify-code').focus();
}

function hideVerifyStep() {
  document.getElementById('signup-form').classList.remove('hidden');
  document.getElementById('verify-step').classList.remove('visible');
}

async function syncWithBackend(clerk) {
  const token = await clerk.session.getToken();
  const resp = await fetch(API_BASE + '/api/auth/sync', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ token }),
  });
  const data = await resp.json();
  if (!resp.ok) throw data;
  return data;
}

async function finishSignup() {
  const urlParams = new URLSearchParams(window.location.search);
  const isFromTrial = urlParams.get('trial') === 'completed';
  if (isFromTrial) {
    try {
      const trialSessionData = localStorage.getItem('itlearn_trial_session');
      const trialProgressData = localStorage.getItem('itlearn_trial_progress');
      if (trialSessionData && trialProgressData) {
        const trialSession = JSON.parse(trialSessionData);
        const trialProgress = JSON.parse(trialProgressData);
        await fetch(API_BASE + '/api/trial/link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            sessionId: trialSession.sessionId,
            courseId: trialSession.courseId,
            startedAt: trialSession.startedAt,
            expiresAt: trialSession.expiresAt,
            chapters: trialProgress.chapters || [],
          }),
        });
      }
    } catch (e) {
    } finally {
      localStorage.removeItem('itlearn_trial_session');
      localStorage.removeItem('itlearn_trial_progress');
    }
  }
  window.location.href = '/learn/index.html';
}

document.addEventListener('DOMContentLoaded', async () => {
  document.body.setAttribute('data-page', 'signup');
  const storedLang = localStorage.getItem('language') || 'en';
  updatePageLanguage(storedLang);
  updateInputPlaceholders(storedLang);
  initPasswordToggle();
  updatePasswordToggleLabels(storedLang);

  const clerk = new Clerk(CLERK_PUBLISHABLE_KEY);
  await clerk.load();

  if (clerk.session) {
    try { await syncWithBackend(clerk); window.location.href = '/learn/index.html'; } catch (e) {}
    return;
  }

  let activeSignUp = null;

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const acceptTerms = document.getElementById('accept-terms').checked;
    const submitBtn = document.querySelector('#signup-form .btn');
    if (submitBtn) submitBtn.disabled = true;

    if (!email || !password) {
      await showAlert('Email and password are required.', { title: 'Validation' });
      if (submitBtn) submitBtn.disabled = false;
      return;
    }
    if (password !== confirmPassword) {
      await showAlert('Passwords do not match.', { title: 'Validation' });
      if (submitBtn) submitBtn.disabled = false;
      return;
    }
    if (!acceptTerms) {
      await showAlert('You must accept the terms and conditions.', { title: 'Validation' });
      if (submitBtn) submitBtn.disabled = false;
      return;
    }

    try {
      const signUpAttempt = await clerk.client.signUp.create({ emailAddress: email, password });
      activeSignUp = signUpAttempt;

      if (signUpAttempt.status === 'complete') {
        await clerk.setActive({ session: signUpAttempt.createdSessionId });
        await syncWithBackend(clerk);
        await finishSignup();
      } else if (signUpAttempt.unverifiedFields.includes('email_address')) {
        await signUpAttempt.prepareEmailAddressVerification({ strategy: 'email_code' });
        showVerifyStep(email);
      } else {
        await showAlert('Signup needs additional steps (status: ' + signUpAttempt.status + ').', { title: 'Signup' });
      }
    } catch (err) {
      const msg = err?.errors?.[0]?.longMessage || err?.error || 'Signup failed.';
      await showAlert('Signup failed: ' + msg, { title: 'Signup failed' });
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  });

  document.getElementById('verify-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!activeSignUp) {
      await showAlert('Session expired. Please sign up again.', { title: 'Error' });
      hideVerifyStep();
      return;
    }
    const code = document.getElementById('verify-code').value.trim();
    const submitBtn = document.querySelector('#verify-form .btn');
    if (submitBtn) submitBtn.disabled = true;

    try {
      const result = await activeSignUp.attemptEmailAddressVerification({ code });
      if (result.status === 'complete') {
        await clerk.setActive({ session: result.createdSessionId });
        await syncWithBackend(clerk);
        await finishSignup();
      } else {
        await showAlert('Verification failed (status: ' + result.status + '). Please try again.', { title: 'Verification' });
      }
    } catch (err) {
      const msg = err?.errors?.[0]?.longMessage || 'Invalid code. Please try again.';
      await showAlert(msg, { title: 'Verification failed' });
    } finally {
      if (submitBtn) submitBtn.disabled = false;
    }
  });

  document.getElementById('resend-btn').addEventListener('click', async () => {
    if (!activeSignUp) return;
    try {
      await activeSignUp.prepareEmailAddressVerification({ strategy: 'email_code' });
      await showAlert('A new code has been sent to your email.', { title: 'Code resent' });
    } catch (err) {
      const msg = err?.errors?.[0]?.longMessage || 'Could not resend code.';
      await showAlert(msg, { title: 'Error' });
    }
  });

  function initOAuthButton(provider, buttonId, clerkStrategy) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    const labelEl = btn.querySelector('.oauth-label');
    const baseLabel = labelEl ? labelEl.textContent : btn.textContent;
    const connecting = btn.dataset.connecting || ('Connecting to ' + provider + '...');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      if (labelEl) labelEl.textContent = connecting;
      else btn.textContent = connecting;

      if (provider === 'Discord') {
        const joinCheckbox = document.getElementById('join-discord-server');
        localStorage.setItem('discord_join_server', joinCheckbox?.checked ? 'true' : 'false');
      }

      try {
        await clerk.client.signUp.authenticateWithRedirect({
          strategy: clerkStrategy,
          redirectUrl: window.location.origin + '/sso-callback.html',
          redirectUrlComplete: window.location.origin + '/learn/index.html',
        });
      } catch (err) {
        const msg = err?.errors?.[0]?.longMessage || ('Could not start ' + provider + ' sign-in.');
        await showAlert(msg, { title: 'Sign-in error' });
        btn.disabled = false;
        if (labelEl) labelEl.textContent = baseLabel;
        else btn.textContent = baseLabel;
      }
    });
  }

  initOAuthButton('Google', 'google-login', 'oauth_google');
  initOAuthButton('GitHub', 'github-login', 'oauth_github');
  initOAuthButton('Discord', 'discord-login', 'oauth_discord');
});

const _origUpdatePageLanguage = window.updatePageLanguage;
window.updatePageLanguage = function(lang) {
  _origUpdatePageLanguage(lang);
  updateInputPlaceholders(lang);
  updatePasswordToggleLabels(lang);
};
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="8826e809-534e-467a-ab6a-60c51a99fa52" data-blockingmode="auto" type="text/javascript"></script>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://itlearn.be/sso-callback">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Learn | Signing In</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827 40%, #0b1530);
      color: #e5e7eb;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      width: min(480px, 100%);
      padding: 1.75rem;
      border-radius: 16px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.4rem; letter-spacing: 0.01em; }
    p { margin: 0 0 1.25rem; color: #cbd5e1; line-height: 1.5; }
    .pulse {
      width: 52px;
      height: 52px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      border: 6px solid rgba(59, 130, 246, 0.3);
      border-top-color: #60a5fa;
      animation: spin 0.9s linear infinite;
    }
    button {
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #1f2937;
      color: #e5e7eb;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    button:hover { background: #111827; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <script src="https://unpkg.com/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
  <script src="/maintenance-mode.js" defer></script>
</head>
<body>
  <div class="card">
    <div class="pulse" aria-hidden="true"></div>
    <h1>Finishing sign-in...</h1>
    <p id="status">Hang tight while we verify your login.</p>
    <button id="retry" hidden>Back to login</button>
  </div>

  <script>
    (function () {
      const CLERK_PUBLISHABLE_KEY = 'pk_live_KEY_HERE';
      const API_BASE = 'https://itlearn.pythonanywhere.com';

      const statusEl = document.getElementById('status');
      const retryBtn = document.getElementById('retry');

      retryBtn.addEventListener('click', () => {
        window.location.href = window.location.origin + '/login.html';
      });

      function fail(message) {
        statusEl.textContent = message;
        retryBtn.hidden = false;
      }

      function redirectToBanScreen(payload) {
        const reason = encodeURIComponent((payload && payload.ban_reason) || 'Account suspended for severe rule violations.');
        const appeal = encodeURIComponent((payload && payload.ban_appeal_url) || 'https://discord.gg/rKgF9s32EV');
        window.location.replace(window.location.origin + '/banned.html?reason=' + reason + '&appeal=' + appeal);
      }

      async function syncWithBackend(clerk) {
        const token = await clerk.session.getToken();
        const resp = await fetch(API_BASE + '/api/auth/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ token }),
        });
        const data = await resp.json();
        if (!resp.ok) throw data;
        return data;
      }

      (async () => {
        try {
          const clerk = new Clerk(CLERK_PUBLISHABLE_KEY);
          await clerk.load();

          statusEl.textContent = 'Verifying your account...';
          await clerk.handleRedirectCallback();

          if (!clerk.session) {
            fail('Sign-in did not complete. Please try again.');
            return;
          }

          statusEl.textContent = 'Syncing your account...';
          const syncData = await syncWithBackend(clerk);

          if (syncData.banned) {
            redirectToBanScreen(syncData);
            return;
          }

          const shouldJoin = localStorage.getItem('discord_join_server') === 'true';
          localStorage.removeItem('discord_join_server');

          if (shouldJoin) {
            try {
              const joinRedirect = window.location.origin + '/learn/index.html';
              const joinRes = await fetch(API_BASE + '/api/discord/join/start?next=' + encodeURIComponent(joinRedirect), {
                credentials: 'include',
              });
              const joinData = await joinRes.json();
              if (joinData && joinData.url) {
                statusEl.textContent = 'Success! Adding you to Discord...';
                window.location.replace(joinData.url);
                return;
              }
            } catch (e) {}
          }

          statusEl.textContent = 'Success! Redirecting to your course...';
          window.location.replace(window.location.origin + '/learn/index.html');

        } catch (err) {
          const msg = err?.errors?.[0]?.longMessage || err?.error || 'Sign-in failed. Please try again.';
          fail(msg);
        }
      })();
    })();
  </script>
</body>
</html>
